<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketPlace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div>
      <h1>🛒 MarketPlace</h1>
      <p>Compre e venda perto de você</p>
    </div>
    <button id="openCreate" class="plus" aria-label="Criar anúncio">+</button>
  </header>

  <main>
    <section class="hero">
      <div>
        <span class="badge">ANÚNCIOS</span>
        <h2>Encontre o que você procura</h2>
      </div>
      <button id="refresh" class="refresh">↻ Atualizar</button>
    </section>

    <div id="status" class="status">Carregando anúncios...</div>
    <section id="products" class="grid"></section>
  </main>

  <div id="createModal" class="modal hidden">
    <div class="modal-card">
      <button class="close" data-close="createModal">×</button>
      <h2>Novo anúncio</h2>
      <p class="muted">Adicione até 3 fotos.</p>

      <form id="adForm">
        <label>Fotos</label>
        <input id="photos" type="file" accept="image/*" multiple required>
        <div id="photoPreview" class="photo-preview"></div>

        <label for="title">Título</label>
        <input id="title" maxlength="100" placeholder="Ex.: iPhone 13 128GB" required>

        <label for="description">Descrição</label>
        <textarea id="description" maxlength="2000" placeholder="Descreva o produto..." required></textarea>

        <label for="price">Preço</label>
        <input id="price" type="number" min="0" step="0.01" placeholder="1500,00" required>

        <label for="location">Local</label>
        <input id="location" maxlength="120" placeholder="Cidade - Estado" required>

        <label for="contact">Contato</label>
        <input id="contact" maxlength="120" placeholder="WhatsApp ou telefone" required>

        <button id="publish" class="primary" type="submit">Publicar anúncio</button>
      </form>
    </div>
  </div>

  <div id="viewModal" class="modal hidden">
    <div class="modal-card detail-card">
      <button class="close" data-close="viewModal">×</button>
      <div id="detail"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
